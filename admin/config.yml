backend:
  name: git-gateway
  repo: smdigitalstudios/habby-interiors
  branch: main

  identity_url: "https://auth.decapbridge.com/sites/3fa3db82-cc2f-436c-89c4-8fdf537f44e8"
  gateway_url: "https://gateway.decapbridge.com"

commit_messages:
  create: 'Create {{collection}} "{{slug}}" - {{author-name}} via Habby Interiors CMS'
  update: 'Update {{collection}} "{{slug}}" - {{author-name}} via Habby Interiors CMS'
  delete: 'Delete {{collection}} "{{slug}}" - {{author-name}} via Habby Interiors CMS'
  uploadMedia: 'Upload "{{path}}" - {{author-name}} via Habby Interiors CMS'
  deleteMedia: 'Delete "{{path}}" - {{author-name}} via Habby Interiors CMS'
  openAuthoring: 'Message {{message}} - {{author-name}} via Habby Interiors CMS'

site_url: "https://habbyinterior.netlify.app"
display_url: "https://habbyinterior.netlify.app"

media_folder: "images/uploads"
public_folder: "images/uploads"

publish_mode: simple

logo_url: "a.png"

collections:
  - name: "homepage"
    label: "Homepage"
    files:
      - name: "homepage"
        label: "Homepage Images"
        file: "content/homepage.json"
        fields:
          - label: "Logo"
            name: "logo"
            widget: "image"
            media_folder: "images/homepage"
            public_folder: "images/homepage"

          - label: "Hero Background Image"
            name: "hero_image"
            widget: "image"
            media_folder: "images/homepage"
            public_folder: "images/homepage"

          - label: "Hero Image Description"
            name: "hero_image_alt"
            widget: "string"
            required: false

          - label: "Residential Interiors Image"
            name: "service_1_image"
            widget: "image"
            media_folder: "images/homepage"
            public_folder: "images/homepage"

          - label: "Residential Interiors Image Description"
            name: "service_1_alt"
            widget: "string"
            required: false

          - label: "Commercial & Hospitality Image"
            name: "service_2_image"
            widget: "image"
            media_folder: "images/homepage"
            public_folder: "images/homepage"

          - label: "Commercial & Hospitality Image Description"
            name: "service_2_alt"
            widget: "string"
            required: false

          - label: "Furniture & Procurement Image"
            name: "service_3_image"
            widget: "image"
            media_folder: "images/homepage"
            public_folder: "images/homepage"

          - label: "Furniture & Procurement Image Description"
            name: "service_3_alt"
            widget: "string"
            required: false

  - name: "projects"
    label: "Projects"
    folder: "content/projects"
    create: true
    delete: true
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}} — {{category}}"

    fields:
      - label: "Project Title"
        name: "title"
        widget: "string"

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Residential"
          - "Commercial"
          - "Hospitality"

      - label: "Location"
        name: "location"
        widget: "string"
        required: false

      - label: "Description"
        name: "description"
        widget: "text"
        required: false

      - label: "Cover Image"
        name: "image"
        widget: "image"
        media_folder: "images/projects"
        public_folder: "images/projects"

      - label: "Image Description"
        name: "image_alt"
        widget: "string"
        required: false

      - label: "Project Gallery"
        name: "gallery"
        widget: "list"
        required: false
        field:
          label: "Gallery Image"
          name: "image"
          widget: "image"
          media_folder: "images/projects"
          public_folder: "images/projects"

      - label: "Display Order"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 1

      - label: "Featured Project"
        name: "featured"
        widget: "boolean"
        default: false

      - label: "Published"
        name: "published"
        widget: "boolean"
        default: true

  - name: "gallery"
    label: "Gallery"
    folder: "content/gallery"
    create: true
    delete: true
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}}"

    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Image"
        name: "image"
        widget: "image"
        media_folder: "images/gallery"
        public_folder: "images/gallery"

      - label: "Caption"
        name: "caption"
        widget: "string"
        required: false

      - label: "Display Order"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 1

      - label: "Published"
        name: "published"
        widget: "boolean"
        default: true

  - name: "testimonials"
    label: "Testimonials"
    folder: "content/testimonials"
    create: true
    delete: true
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    identifier_field: "name"
    summary: "{{name}}"

    fields:
      - label: "Client Name"
        name: "name"
        widget: "string"

      - label: "Testimonial"
        name: "text"
        widget: "text"

      - label: "Client Image"
        name: "image"
        widget: "image"
        required: false
        media_folder: "images/testimonials"
        public_folder: "images/testimonials"

      - label: "Display Order"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 1

      - label: "Published"
        name: "published"
        widget: "boolean"
        default: true
